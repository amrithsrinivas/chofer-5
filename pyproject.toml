[project]
name = "chofer"
version = "0.1.0"
description = "Reproducible data indexer for Polymarket crypto trading research"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pyarrow>=17",
    "pydantic>=2",
    "tomlkit>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
chofer = "chofer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chofer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

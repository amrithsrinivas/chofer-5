[pmdata]

market_data_types = [
  "poly_l2",
  "poly_trade",
  "onchain_fills",
]

# Historical Chainlink indexing is intentionally disabled. PMData's live files
# do not match the documented contract, coverage begins well after the research
# start date, and the initial model uses Gamma/PMData resolution observations
# for labels rather than Chainlink values as features.
#
# [pmdata.chainlink_feeds.btc_usd]
# asset = "BTC"
# symbol = "BTCUSD"
# recording_starts_at = "2026-06-07T00:00:00Z"
#
# [pmdata.chainlink_feeds.eth_usd]
# asset = "ETH"
# symbol = "ETHUSD"
# recording_starts_at = "2026-06-07T00:00:00Z"
#
# [pmdata.chainlink_feeds.sol_usd]
# asset = "SOL"
# symbol = "SOLUSD"
# recording_starts_at = "2026-06-07T00:00:00Z"
#
# [pmdata.chainlink_feeds.xrp_usd]
# asset = "XRP"
# symbol = "XRPUSD"
# recording_starts_at = "2026-06-07T00:00:00Z"

# ── BTC ─────────────────────────────────────────────────────────────────────

[pmdata.series.btc_5m]
asset = "BTC"
interval = "5m"
provider_series = "btc-5m"
recording_starts_at = "2026-02-13T17:00:00Z"

[pmdata.series.btc_15m]
asset = "BTC"
interval = "15m"
provider_series = "btc-15m"
recording_starts_at = "2026-01-26T08:00:00Z"

[pmdata.series.btc_1h]

[dataset]
spec_version = "1"
name = "crypto-5m-premarket-smoke"
description = "Four-asset real-lake integration sample"
assets = ["BTC", "ETH", "SOL", "XRP"]
interval = "5m"
features = [
  "book_midprice",
  "book_spread",
  "book_imbalance",
  "trade_pressure_60s",
  "primary_spot_return_5m",
  "btc_spot_return_5m",
  "eth_spot_return_5m",
  "sol_spot_return_5m",
  "xrp_spot_return_5m",
  "time_of_day_sin",
  "time_of_day_cos",
]
execution_delay = "250ms"
output_path = "/Volumes/chofer-data/data/derived/datasets"

[dataset.time_range]
start = "2026-07-18T00:00:00Z"
end = "2026-07-19T00:00:00Z"

[[dataset.decision_schedules]]
label = "premarket_t_minus_30s"
anchor = "window_start"
offset = "-30s"

[dataset.availability_policies.pmdata]
version = "pmdata_local_timestamp_utc_clamped_v1"

[dataset.availability_policies.binance]
version = "modeled_live_research_v1"
delay_seconds = "250ms"

[dataset.quote]
max_staleness_seconds = "5s"
band_min = 0.45
band_max = 0.55
depth_levels = 5

[dataset.sources]
poly_l2 = "required"
poly_trade = "optional"
spot_klines = "optional"
